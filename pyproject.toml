[project]
name = "free-seo-mcp"
version = "0.1.0"
description = "Zero-budget keyword research MCP server: autocomplete, Google Trends, Bing Webmaster volumes, Reddit, competitor sitemaps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "seo", "keyword-research", "google-trends", "autocomplete"]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2.7",
    "trendspy>=0.1.6",
    "anyio>=4",
]

[project.scripts]
free-seo-mcp = "free_seo_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/free_seo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network; run with -m live"]
addopts = "-m \"not live\""
